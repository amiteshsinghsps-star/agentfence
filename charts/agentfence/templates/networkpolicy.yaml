{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentfence.fullname" . }}-default-deny
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentfence.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentfence.fullname" . }}-allow-internal
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentfence.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 8443
        - port: 8080
        - port: 8081
{{- end }}
