apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentfence.fullname" . }}-dashboard
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "agentfence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "agentfence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VITE_AGENTFENCE_API_URL
              value: "http://{{ include "agentfence.fullname" . }}-apiserver:8081"
            - name: VITE_AGENTFENCE_WS_URL
              value: "ws://{{ include "agentfence.fullname" . }}-wsgateway:8080/ws/stream"
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentfence.fullname" . }}-dashboard
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "agentfence.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- if .Values.dashboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentfence.fullname" . }}-dashboard
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.dashboard.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.dashboard.ingress.className }}
  rules:
    - host: {{ .Values.dashboard.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentfence.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
  {{- with .Values.dashboard.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
