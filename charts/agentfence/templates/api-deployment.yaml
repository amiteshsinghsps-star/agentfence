apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentfence.fullname" . }}-apiserver
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      {{- include "agentfence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels:
        {{- include "agentfence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apiserver
    spec:
      containers:
        - name: apiserver
          image: "{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag }}"
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: api
          env:
            - name: AGENTFENCE_API_ADDR
              value: ":8081"
            - name: NATS_URL
              value: "nats://{{ include "agentfence.fullname" . }}-nats:4222"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "agentfence.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            {{- with .Values.apiserver.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentfence.fullname" . }}-apiserver
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  type: {{ .Values.apiserver.service.type }}
  ports:
    - port: {{ .Values.apiserver.service.port }}
      targetPort: api
      name: api
  selector:
    {{- include "agentfence.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
