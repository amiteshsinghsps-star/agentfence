apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentfence.fullname" . }}-proxy
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      {{- include "agentfence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "agentfence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8443"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentfence.fullname" . }}-proxy
      containers:
        - name: proxy
          image: {{ include "agentfence.proxyImage" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - containerPort: 8443
              name: mcp
            - containerPort: 8443
              name: health
          env:
            - name: AGENTFENCE_FREEZE_THRESHOLD
              value: "{{ .Values.proxy.fencing.freezeThreshold }}"
            - name: AGENTFENCE_QUARANTINE_THRESHOLD
              value: "{{ .Values.proxy.fencing.quarantineThreshold }}"
            - name: AGENTFENCE_FAILURE_MODE
              value: "{{ .Values.proxy.failureMode }}"
            - name: NATS_URL
              value: "nats://{{ include "agentfence.fullname" . }}-nats:4222"
            - name: REDIS_URL
              value: "redis://{{ include "agentfence.fullname" . }}-redis:6379"
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "agentfence.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            {{- with .Values.proxy.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentfence.fullname" . }}-proxy
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: mcp
      name: mcp
  selector:
    {{- include "agentfence.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
