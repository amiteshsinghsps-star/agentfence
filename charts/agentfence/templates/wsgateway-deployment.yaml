apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentfence.fullname" . }}-wsgateway
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: wsgateway
spec:
  replicas: {{ .Values.wsgateway.replicas }}
  selector:
    matchLabels:
      {{- include "agentfence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wsgateway
  template:
    metadata:
      labels:
        {{- include "agentfence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wsgateway
    spec:
      containers:
        - name: wsgateway
          image: "{{ .Values.wsgateway.image.repository }}:{{ .Values.wsgateway.image.tag }}"
          imagePullPolicy: {{ .Values.wsgateway.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: ws
          env:
            - name: AGENTFENCE_WS_ADDR
              value: ":8080"
            - name: NATS_URL
              value: "nats://{{ include "agentfence.fullname" . }}-nats:4222"
            {{- with .Values.wsgateway.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.wsgateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentfence.fullname" . }}-wsgateway
  labels:
    {{- include "agentfence.labels" . | nindent 4 }}
    app.kubernetes.io/component: wsgateway
spec:
  type: {{ .Values.wsgateway.service.type }}
  ports:
    - port: {{ .Values.wsgateway.service.port }}
      targetPort: ws
      name: ws
  selector:
    {{- include "agentfence.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wsgateway
