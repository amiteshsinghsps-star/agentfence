apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentfencepolicies.agentfence.io
  labels:
    app.kubernetes.io/name: agentfence
spec:
  group: agentfence.io
  names:
    kind: AgentFencePolicy
    plural: agentfencepolicies
    singular: agentfencepolicy
    shortNames:
      - afp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                regoSource:
                  type: string
                  description: Rego policy source code
                bundleURL:
                  type: string
                  description: URL to OPA bundle
                version:
                  type: string
                  description: Policy version
                dryRun:
                  type: boolean
                  default: false
                  description: Whether to run in dry-run mode (log only, no enforcement)
                suspend:
                  type: boolean
                  default: false
                  description: Suspend policy enforcement
              oneOf:
                - required: [regoSource]
                - required: [bundleURL]
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Dry-Run
          type: boolean
          jsonPath: .spec.dryRun
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
