# AgentFence Helm Chart Values
# Default values for agentfence control plane deployment.

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []

# Proxy configuration
proxy:
  mode: gateway            # gateway | sidecar
  replicas: 2
  image:
    repository: agentfence/proxy
    tag: v0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8443
    mcpPort: 8443
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi
  fencing:
    freezeThreshold: 0.50
    quarantineThreshold: 0.75
  failureMode: closed       # closed | open — what happens if AgentFence itself is unavailable
  env: []
  extraArgs: []

# WebSocket gateway configuration
wsgateway:
  replicas: 2
  image:
    repository: agentfence/wsgateway
    tag: v0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env: []

# Control-plane API configuration
apiserver:
  replicas: 2
  image:
    repository: agentfence/apiserver
    tag: v0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env: []

# Dashboard (React static build)
dashboard:
  replicas: 1
  image:
    repository: agentfence/dashboard
    tag: v0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    host: agentfence.internal.example.com
    className: nginx
    annotations: {}
    tls: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# PostgreSQL
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  storage: 50Gi
  storageClass: standard
  auditRetentionDays: 400
  auth:
    database: agentfence
    username: agentfence
    password: changeme
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

# Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7"
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# NATS JetStream
nats:
  enabled: true
  replicas: 3
  image:
    repository: nats
    tag: "2.10"
  jetstream:
    enabled: true
    maxAge: 720h            # 30-day in-cluster retention
    storage: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Policy bundle configuration
policyBundle:
  source: configmap  # configmap | git
  configMapName: agentfence-policy-bundle
  git:
    repo: https://github.com/your-org/agentfence-policies
    path: policy/agentfence
    pollInterval: 30s

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRules:
    enabled: true
    alerts:
      chainVerificationFailure:
        severity: critical
        description: "Audit chain verification failure detected"
      highFenceRate:
        severity: warning
        description: "Sudden spike in fence events"

# Sidecar injection
sidecarInjector:
  enabled: true
  namespaceSelector:
    matchLabels:
      agentfence.io/inject: enabled
  objectSelector:
    matchLabels:
      agentfence.io/inject: "true"

# Network policies
networkPolicy:
  enabled: true
  defaultDeny: true
  allowNamespaces:
    - kube-system
    - monitoring

# RBAC
rbac:
  create: true
  serviceAccountAnnotations: {}

# Ingress
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []
